[project]
name = "barua"
version = "0.1.0"
description = "Privacy-first delayed digital letters."
requires-python = ">=3.13"
dependencies = [
    "django>=6.0,<6.1",
    "psycopg[binary]>=3.3,<3.4",
    "python-dotenv>=1.2,<1.3",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6,<4.7",
    "ruff>=0.15,<0.16",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"config/settings/development.py" = ["F403", "F405"]
"config/settings/production.py" = ["F403", "F405"]
"core/migrations/*.py" = ["E501", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
